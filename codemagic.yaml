workflows:
  ios-simulator-build:
    name: JOEMAR iOS Simulator Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - joemar_env
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Create .env file
        script: |
          cat <<EOF > .env
          EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL
          EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY
          EXPO_PUBLIC_SERVICE_ROLE_KEY=$EXPO_PUBLIC_SERVICE_ROLE_KEY
          EXPO_PUBLIC_DISABLE_MFA=$EXPO_PUBLIC_DISABLE_MFA
          GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY
          MAPBOX_API_KEY=$MAPBOX_API_KEY
          EOF
      - name: Install JavaScript dependencies
        script: |
          npm ci || npm install
      - name: Patch expo-dev-menu simulator macro
        script: |
          FILE="node_modules/expo-dev-menu/ios/DevMenuViewController.swift"
          if [ -f "$FILE" ]; then
            node -e '
              const fs = require("fs");
              const file = process.argv[1];
              let content = fs.readFileSync(file, "utf8");
              content = content.replace(
                /let\s+isSimulator\s*=\s*TARGET_(?:OS|IPHONE)_SIMULATOR\s*>\s*0/,
                `#if targetEnvironment(simulator)\n    let isSimulator = true\n    #else\n    let isSimulator = false\n    #endif`
              );
              fs.writeFileSync(file, content, "utf8");
            ' "$FILE"
            grep -n -C 3 "isSimulator" "$FILE" || true
          fi
      - name: Generate native iOS project (Expo Prebuild)
        script: |
          npx expo prebuild --platform ios --non-interactive
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          echo "--- Before patch ---"
          head -n 15 Podfile
          cat Podfile.properties.json || true

          # 1. Replace any platform :ios, '...' line (single or double quotes, with or without spaces)
          sed -i '' -E "s/platform[[:space:]]+:ios,[[:space:]]*['\"][0-9.]+['\"]/platform :ios, '15.1'/g" Podfile

          # 2. If Podfile uses min_ios_version_supported, update it in Podfile or Podfile.properties.json
          if [ -f Podfile.properties.json ]; then
            node -e '
              const fs = require("fs");
              const p = "Podfile.properties.json";
              const j = JSON.parse(fs.readFileSync(p, "utf8"));
              j["ios.deploymentTarget"] = "15.1";
              fs.writeFileSync(p, JSON.stringify(j, null, 2));
            '
          fi

          # Also override min_ios_version_supported in Podfile if present
          sed -i '' -E "s/min_ios_version_supported[[:space:]]*=[[:space:]]*['\"][0-9.]+['\"]/min_ios_version_supported = '15.1'/g" Podfile

          echo "--- After patch ---"
          head -n 15 Podfile

          pod install
      - name: Build unsigned iOS Simulator .app
        script: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            EXCLUDED_ARCHS=x86_64 \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package .app for download
        script: |
          mkdir -p build/output
          APP_PATH=$(find build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -n 1)
          cp -R "$APP_PATH" build/output/
          cd build/output && zip -r JOEMARMobileApp-simulator.zip *.app
    artifacts:
      - build/output/*.zip