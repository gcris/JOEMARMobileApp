workflows:
  ios-simulator-build:
    name: JOEMAR iOS Simulator Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: default
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install JavaScript dependencies
        script: |
          npm ci || npm install
      - name: Generate native iOS project (Expo Prebuild)
        script: |
          npx expo prebuild --platform ios --non-interactive
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Build unsigned iOS Simulator .app
        script: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package .app for download
        script: |
          mkdir -p build/output
          APP_PATH=$(find build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -n 1)
          cp -R "$APP_PATH" build/output/
          cd build/output && zip -r JOEMARMobileApp-simulator.zip *.app
    artifacts:
      - build/output/*.zip